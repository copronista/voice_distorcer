MaintainerNotes: |
  Build with JDK 17 and Android SDK 35 using the included Gradle wrapper.
  All dependencies come from Maven Central and Google Maven; no proprietary
  SDKs or push services are used. The app declares no INTERNET permission.
  The full build requests RECORD_AUDIO and CAMERA for local recording only.
  The audio-only variant uses a different application ID and is maintained on
  the audio_only branch; it is not part of this F-Droid entry.
